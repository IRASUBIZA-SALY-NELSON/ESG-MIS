# This workflow runs on self-hosted runner on app's server
name: Build

on:
  push:
    branches:
      - main
    paths-ignore: ['.vscode/**']

jobs:
  eslint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          check-latest: true
      - run: npm i -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Format files
        run: yarn run format

      - name: Fix ESLint errors
        run: yarn run lint:fix

      - name: Run Build
        run: yarn run build
